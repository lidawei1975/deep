name: C++ Build with AWS ECR Image

on:
  pull_request:
    branches: [ master-off ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2 # Change to your ECR repository's region

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker image from ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spin/spin_ubuntu24 # Replace with your ECR repository name
          IMAGE_TAG: latest # Replace with your desired image tag
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build C++ project
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spin/spin_ubuntu24
          IMAGE_TAG: latest 
        run: |
          docker run --workdir /github/workspace --volume "$(pwd)":"/github/workspace" $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG /bin/bash -c "
          cmake -S . -B build &&
          make -C build install
          "
          
      - name: Upload folders and files to S3 (preserve structure)
        run: |
          aws s3 cp release/    s3://spin-artifact/deep-picker/release/ --recursive

